name: Docs gap
description: Suggest a missing or unclear explanation.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: textarea
    id: gap
    attributes:
      label: What is unclear?
      description: Name the page, section, or workflow that needs help.
    validations:
      required: true
  - type: textarea
    id: reader
    attributes:
      label: Reader goal
      description: What should the reader be able to do after the docs improve?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
      description: A short outline is enough.
